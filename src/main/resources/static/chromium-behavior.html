<dom-module id="lgtm-catcher">
  <script>
    Gerrit.install(plugin => {
      const replyApi = plugin.changeReply();
      const label = 'Code-Review';
      let autoAdded = false;
      replyApi.addReplyTextChangedCallback(text => {
        const labelValue = replyApi.getLabelValue(label);
        if (!labelValue) {
          return;
        }
        if (labelValue === ' 0' &&
            text.trim().toLowerCase().indexOf('lgtm') === 0) {
          autoAdded = true;
          replyApi.setLabelValue(label, '+1');
        } else if (labelValue === '+1' && autoAdded === true &&
            text.trim().toLowerCase().indexOf('lgtm') !== 0) {
          autoAdded = false;
          replyApi.setLabelValue(label, ' 0');
        }
      });
    });
  </script>
</dom-module>
